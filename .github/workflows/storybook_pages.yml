name: Deploy Storybook to GitHub Pages

# Builds the Storybook static site and publishes it to GitHub Pages.
# Served at https://eliteaai.github.io/EliteaUI/storybook/
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.storybook/**'
      - 'package.json'
      - '.github/workflows/storybook_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that is in progress.
concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Install dependencies
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npm install

      - name: Build Storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Build-time defaults normally supplied by the (gitignored) .env.
          # Without them module-level constants like VITE_SERVER_URL are undefined and stories crash.
          # Non-secret placeholders only: stories don't call the backend.
          VITE_SERVER_URL: '/api/v2/'
          VITE_BASE_URI: '/elitea_ui'
          VITE_SOCKET_PATH: '/socket.io/'
          VITE_PUBLIC_PROJECT_ID: '1'
        run: npm run build-storybook -- --output-dir _pages/storybook --quiet

      - name: Disable Jekyll processing
        run: touch _pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
