name: Build and release from tag

on:
  push:
    tags: [ '*' ]

  workflow_dispatch:
    inputs:
      tag:
        default: "latest"
        description: "Release tag"
        required: true
      runner:
        type: choice
        description: "Action runs on"
        options:
          - self-hosted
          - ubuntu-latest
        required: true

# Serialize runs per ref so hotfix version bumps don't race each other
concurrency:
  group: tag-build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || fromJSON('["self-hosted", "Linux"]') }}
    steps:
      - name: Clear repository
        run: rm -rf $GITHUB_WORKSPACE && mkdir $GITHUB_WORKSPACE

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Take the latest branch head, not the dispatch-time SHA, so the bump pushes on top of previous bumps
          ref: ${{ github.ref }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 23.11.0

      - name: Install dependencies
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm install

      - name: Bump hotfix version in package.json
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
        id: bump_version
        run: |
          # Get the current version from package.json
          current_version=$(node -p "require('./package.json').version")

          # 0.4.2219 -> 0.4.2219-hotfix.1, 0.4.2219-hotfix.1 -> 0.4.2219-hotfix.2
          # Never touch the numeric part: those numbers belong to main
          new_version=$(node -e "let match = '$current_version'.match(/^(.+)-hotfix\.(\d+)$/); console.log(match ? match[1] + '-hotfix.' + (parseInt(match[2]) + 1) : '$current_version-hotfix.1');")
          # Update package.json with the new version
          node -e "let pkg = require('./package.json'); pkg.version = '$new_version'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

          # Configure Git user info for this commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push changes
          git add package.json
          git commit -m "build: [EL-1000] Increment version to $new_version [skip ci]" || echo "No changes to commit"
          git push

          echo "::notice title=Version Bump::Incrementing version from $current_version to $new_version"

      - name: Build project
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build -- --base=./

      - name: Collect head version
        run: |
          head_version=$(git rev-parse HEAD)
          echo "$head_version" >> ./dist/head.txt

      - name: Zip artifacts
        run: zip -r ../EliteAUI.zip .
        working-directory: ./dist

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./EliteAUI.zip
          makeLatest: false
          allowUpdates: true
          tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Read version from package.json
        id: ui_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "::notice title=UI Version::Releasing EliteaUI version $version"

          # elitea_core branch to sync: the release branch itself, or release/<tag> for tag pushes
          if [ "${{ github.ref_type }}" = "tag" ]; then
            target_branch="release/${{ github.ref_name }}"
          else
            target_branch="${{ github.ref_name }}"
          fi
          echo "target_branch=$target_branch" >> $GITHUB_OUTPUT

      - name: Notify elitea_core of UI version
        if: steps.ui_version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/EliteaAI/elitea_core/dispatches" \
            -d '{"event_type":"ui-version-updated","client_payload":{"ui_version":"${{ steps.ui_version.outputs.version }}","ref":"${{ steps.ui_version.outputs.target_branch }}"}}' \
            || echo "::warning::Failed to notify elitea_core of UI version"
