name: Build + Release + Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        default: 'latest'
        description: 'Release tag'
        required: true
      runner:
        type: choice
        description: 'Action runs on'
        options:
          - self-hosted
          - ubuntu-latest
        required: true
      increment_version:
        type: boolean
        description: 'Increment version in package.json'
        default: true

  push:
    branches:
      - main

env:
  DEFAULT_TAG: 'latest'

jobs:
  build_and_release:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || fromJSON('["self-hosted", "Linux"]') }}
    steps:
      - name: Clear repository
        run: rm -rf $GITHUB_WORKSPACE && mkdir $GITHUB_WORKSPACE

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Install dependencies
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npm install

      - name: Bump version in package.json
        if: github.event_name == 'push' || github.event.inputs.increment_version == 'true'
        id: bump_version
        run: |
          # Get the current version from package.json
          current_version=$(node -p "require('./package.json').version")

          # Increment the rightmost value by 1
          new_version=$(node -e "let versionParts = '$current_version'.split('.'); versionParts[versionParts.length - 1] = parseInt(versionParts[versionParts.length - 1]) + 1; console.log(versionParts.join('.'));")
          # Update package.json with the new version
          node -e "let pkg = require('./package.json'); pkg.version = '$new_version'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

          # Configure Git user info for this commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push changes. This push uses the GitHub App token, and App-token pushes
          # do start workflow runs, so [skip ci] is the only thing preventing an endless build
          # loop here -- and, since this workflow now dispatches to elitea_core, an endless
          # version bump there too. Do not remove it.
          git add package.json
          git commit -m "build: [EL-1000] Increment version to $new_version [skip ci]" || echo "No changes to commit"
          git push

          # Publish these as outputs for the next step
          echo "old_version=$current_version" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Build project
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npm run build -- --base=./

      - name: Collect head version
        run: |
          head_version=$(git rev-parse HEAD)
          echo "$head_version" >> ./dist/head.txt

      - name: Zip artifacts
        run: zip -r ../EliteAUI.zip .
        working-directory: ./dist

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./EliteAUI.zip
          makeLatest: true
          allowUpdates: true
          tag: ${{ github.event.inputs.tag || env.DEFAULT_TAG }}

      # Scoped to elitea_core alone and minted here rather than reusing the app-token step
      # above, whose token is what pushes the package.json bump to protected main.
      - name: Mint token for elitea_core
        id: core-token
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: EliteaAI
          repositories: elitea_core
          permission-contents: write

      # The UI ships inside elitea_core, so a UI-only release must advance the version Admin
      # Configuration displays. elitea_core's own versioneer subscribes to this event.
      #
      # The `if:` deliberately carries no status function. GitHub ANDs an implicit success()
      # into it, and that is the only thing stopping a failed or cancelled build from bumping
      # elitea_core. Writing always() or !cancelled() here removes that gate.
      #
      # curl rather than gh: the push-triggered runner is self-hosted and carries no
      # guarantee of gh or jq.
      - name: Notify elitea_core of new UI release
        if: github.ref == 'refs/heads/main'
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
          UI_VERSION: ${{ steps.bump_version.outputs.new_version || 'unchanged' }}
          RELEASE_TAG: ${{ github.event.inputs.tag || env.DEFAULT_TAG }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/elitea_core_dispatch.json"
          cat > "$payload" <<EOF
          {
            "event_type": "elitea-ui-released",
            "client_payload": {
              "ui_version": "${UI_VERSION}",
              "ui_sha": "${GITHUB_SHA}",
              "ui_release_tag": "${RELEASE_TAG}",
              "target_branch": "main",
              "source_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            }
          }
          EOF
          curl -sS -X POST \
            -H "Authorization: Bearer ${CORE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d @"$payload" \
            --fail-with-body \
            https://api.github.com/repos/EliteaAI/elitea_core/dispatches

      - name: Show version bump annotation
        if: steps.bump_version.outputs.new_version != ''
        # This step uses the output from the "bump_version" step
        run: |
          echo "::notice title=Version Bump::Incrementing version from ${{ steps.bump_version.outputs.old_version }} to ${{ steps.bump_version.outputs.new_version }}"

